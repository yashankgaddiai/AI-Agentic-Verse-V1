<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Coach Offer: Coming Soon | AI Agentic Verse</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="description" content="The Coach Offer from AI Agentic Verse is coming soon. Get notified when it's ready." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      *:focus-visible {
        outline: 2px solid #E08A6D;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#141210] text-[#FBFAF8] font-sans antialiased selection:bg-[#C25A3C]/40 flex flex-col overflow-x-hidden">
    <!-- Top Bar -->
    <header class="relative z-10 w-full">
      <div class="max-w-7xl mx-auto px-6 sm:px-8 md:px-14 h-20 flex items-center">
        <a href="/" class="flex items-center gap-3 text-white/80 hover:text-white transition-colors">
          <div class="w-7 h-7 rounded-[6px] bg-white p-0.5 flex items-center justify-center overflow-hidden">
            <img src="/images/logo.png" alt="AI Agentic Verse Logo" class="w-full h-full object-contain" />
          </div>
          <span class="font-semibold text-[13px] uppercase tracking-[0.24em]">AI Agentic Verse</span>
        </a>
      </div>
    </header>

    <main class="relative flex-1 flex flex-col items-center justify-center px-6 py-16 text-center">
      <!-- Coming Soon over a glowing planet edge -->
      <div class="relative flex items-center justify-center w-full">
        <div aria-hidden="true" class="pointer-events-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-[58%] w-[min(460px,82vw)] aspect-square">
          <!-- Halo behind the rim -->
          <div class="absolute -inset-[18%] rounded-full blur-3xl" style="background: radial-gradient(circle at 50% 28%, rgba(224, 138, 109, 0.55) 0%, rgba(194, 90, 60, 0.22) 30%, transparent 58%);"></div>
          <!-- Planet: lit rim on top, fading into the background below -->
          <div class="absolute inset-0 rounded-full" style="background: linear-gradient(to bottom, #3A2E29 0%, #241D1A 30%, #141210 62%); box-shadow: inset 0 2px 0 rgba(255, 190, 160, 0.45), 0 -24px 70px -18px rgba(224, 138, 109, 0.75);"></div>
        </div>

        <div class="relative space-y-6 py-24 sm:py-32">
          <p class="text-[11.5px] font-semibold uppercase tracking-[0.32em] text-[#E08A6D] mr-[-0.32em]">The Coach Offer</p>
          <h1 class="text-[20px] sm:text-[28px] md:text-[32px] font-medium uppercase tracking-[0.6em] mr-[-0.6em]">Coming Soon</h1>
        </div>
      </div>

      <!-- Notify form (sent to Web3Forms) -->
      <div class="relative w-full max-w-md space-y-4">
        <p class="text-[12px] font-semibold uppercase tracking-[0.24em] text-[#E08A6D] mr-[-0.24em]">Get notified when it's ready</p>
        <form id="notify-form" class="flex items-center gap-1 p-1 rounded-full bg-black/40 border border-white/10 focus-within:border-[#E08A6D]/60 transition-colors">
          <label for="notify-email" class="sr-only">Email</label>
          <input
            id="notify-email"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="Enter your email"
            class="flex-1 min-w-0 h-11 px-5 bg-transparent text-[14px] text-white placeholder:text-white/40 focus:outline-none"
          />
          <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true" />
          <button type="submit" class="shrink-0 h-11 px-6 rounded-full bg-[#C25A3C] hover:bg-[#A94B30] text-white text-[12px] font-semibold uppercase tracking-[0.14em] transition-colors disabled:opacity-70 disabled:cursor-wait">
            Notify me
          </button>
        </form>
        <p id="notify-status" class="min-h-[20px] text-[13px] text-white/70" aria-live="polite"></p>
        <a href="https://cal.com/ai-agentic-verse-to0cb6/30min" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center h-11 px-6 rounded-full border border-white/20 hover:border-[#E08A6D] hover:bg-white/5 text-white text-[12px] font-semibold uppercase tracking-[0.14em] transition-colors">
          Book A Strategy Call
        </a>
      </div>
    </main>

    <footer class="relative w-full">
      <div class="max-w-7xl mx-auto px-6 sm:px-8 md:px-14 py-8 flex flex-col md:flex-row items-center justify-between gap-4 text-[13px] text-white/50">
        <a href="/" class="hover:text-white underline underline-offset-4 decoration-white/20 transition-colors">← Back to AI Agentic Verse</a>
        <a href="mailto:aiagenticverse.info@gmail.com" class="hover:text-white transition-colors">aiagenticverse.info@gmail.com</a>
      </div>
    </footer>

    <script>
      (function () {
        var PAGE_NAME = 'The Coach Offer';
        var form = document.getElementById('notify-form');
        var status = document.getElementById('notify-status');
        var button = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (form.botcheck.checked) return;

          button.disabled = true;
          button.textContent = 'Sending…';
          status.textContent = '';

          fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({
              access_key: 'c8529d94-abf5-495a-8aba-c93cfeb08ed4',
              subject: 'Coming soon notify request: ' + PAGE_NAME,
              from_name: 'AI Agentic Verse website',
              email: form.email.value,
              page: PAGE_NAME,
            }),
          })
            .then(function (res) { return res.json(); })
            .then(function (result) {
              if (!result.success) throw new Error(result.message);
              status.textContent = "Thanks. We'll email you when it's live.";
              form.reset();
            })
            .catch(function () {
              status.textContent = 'Something went wrong. Please try again.';
            })
            .finally(function () {
              button.disabled = false;
              button.textContent = 'Notify me';
            });
        });
      })();
    </script>
  </body>
</html>
